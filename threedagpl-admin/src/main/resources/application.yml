# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.7
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（Windows 配置 D:/ruoyi/uploadPath，Linux 配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取 ip 地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的 HTTP 端口，默认为 8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat 的 URI 编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为 100
    accept-count: 1000
    threads:
      # tomcat 最大线程数，默认为 200
      max: 800
      # Tomcat 启动初始化的线程数，默认值 10
      min-spare: 100

# 日志配置
logging:
  level:
    com.threedagpl: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认 10 分钟）
    lockTime: 10

# Spring 配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为 6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
      # 如果Redis未启动,可以临时禁用:
      # 将下面的enabled设置为false可以禁用Redis
      enabled: true
  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
          options:
            model: deepseek-r1:1.5b
            temperature: 0.7
            num_predict: 2048
      embedding:
          options:
            model: nomic-embed-text

# AI RAG 配置
ai:
  rag:
    topk: 5


# token 配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认 30 分钟）
  expireTime: 30

# MyBatis 配置
#mybatis:
#  # 搜索指定包别名
#  typeAliasesPackage: com.threedagpl.**.domain
#  # 配置 mapper 的扫描，找到所有的 mapper.xml 映射文件
#  mapperLocations: classpath*:mapper/**/*Mapper.xml
#  # 加载全局的配置文件
#  configLocation: classpath:mybatis/mybatis-config.xml
#

# MyBatis Plus 配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.threedagpl.**.domain
  # 配置 mapper 的扫描，找到所有的 mapper.xml 映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml


# PageHelper 分页插件
pagehelper:
  helperDialect: postgresql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

# Swagger 配置
swagger:
  # 是否开启 swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止 XSS 攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/system/article
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
